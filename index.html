<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud Estudiantes</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <form action="" id="formulario">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingrese el nombre aqui">
        <small id="errorNombre"></small>

        <label for="correo">Correo:</label>
        <input type="text" id="correo" placeholder="Ingrese el correo aqui">
        <small id="errorCorreo"></small>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" placeholder="Ingrese la edad aqui">
        <small id="errorEdad"></small>

        <button type="submit" id="btnGuardar">
            Registrar estudiante
        </button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Edad</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaEstudiantes"></tbody>
    </table>

    <script src="./js/app.js"></script>
</body>
</html>
